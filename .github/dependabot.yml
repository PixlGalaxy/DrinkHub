version: 2
updates:
  # Frontend (Node / npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
    # Wait before proposing a freshly published version: hijacked releases
    # (Axios, Shai-Hulud, ChainDrop...) are usually caught and pulled within days.
    # Security updates are not delayed by this.
    cooldown:
      default-days: 7
    groups:
      # Minor/patch grouped into one PR (auto-merged); majors open separate PRs for manual review
      frontend-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Backend (Node / npm)
  - package-ecosystem: "npm"
    directory: "/backend"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
    # Wait before proposing a freshly published version: hijacked releases
    # (Axios, Shai-Hulud, ChainDrop...) are usually caught and pulled within days.
    # Security updates are not delayed by this.
    cooldown:
      default-days: 7
    groups:
      # Minor/patch grouped into one PR (auto-merged); majors open separate PRs for manual review
      backend-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
    # Wait before proposing a freshly published version: hijacked releases
    # (Axios, Shai-Hulud, ChainDrop...) are usually caught and pulled within days.
    # Security updates are not delayed by this.
    cooldown:
      default-days: 7

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
    # Wait before proposing a freshly published version: hijacked releases
    # (Axios, Shai-Hulud, ChainDrop...) are usually caught and pulled within days.
    # Security updates are not delayed by this.
    cooldown:
      default-days: 7
