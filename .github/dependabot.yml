version: 2
updates:
  # Frontend (Node / npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
    groups:
      # Minor/patch grouped into one PR (auto-merged); majors open separate PRs for manual review
      frontend-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Backend (Python / pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
    groups:
      # Minor/patch grouped into one PR (auto-merged); majors open separate PRs for manual review
      backend-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
